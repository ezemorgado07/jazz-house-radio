<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A dark-mode lo-fi radio player with a reactive visualizer and synthesized ambient mixer. Built with React 19 + Web Audio API, 100% client-side."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jazz-house-radio.vercel.app" />
    <meta property="og:title" content="Jazz House Radio" />
    <meta
      property="og:description"
      content="Lo-fi radio player with reactive visualizer and ambient mixer. All client-side."
    />
    <meta
      property="og:image"
      content="https://jazz-house-radio.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1665" />
    <meta property="og:image:height" content="945" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jazz-house-radio.vercel.app" />
    <meta name="twitter:title" content="Jazz House Radio" />
    <meta
      name="twitter:description"
      content="Lo-fi radio player with reactive visualizer and ambient mixer."
    />
    <meta
      name="twitter:image"
      content="https://jazz-house-radio.vercel.app/og-image.png"
    />

    <title>Jazz House Radio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var t = localStorage.getItem('jhr:theme');
        if (t === 'midnight' || t === 'rainy' || t === 'vinyl') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
